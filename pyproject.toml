[project]
name = "docintel"
version = "0.1.0"
description = "AI-powered document intelligence for the Care Guide assessment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "arq>=0.26",
    "redis>=5.2",
    "pypdf>=5.1",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "pillow>=11",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "python-multipart>=0.0.12",
    "openai>=1.58",
]

[project.optional-dependencies]
search = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "fpdf2>=2.8",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
